name: MLOps CI/CD Pipeline AWS

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_API: hotel-mlops-api
  ECR_REPOSITORY_DASHBOARD: hotel-mlops-dashboard
  EKS_CLUSTER_NAME: hotel-mlops-cluster

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Requerido para OIDC AWS
      contents: read
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies & Run Tests
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel
        pip install pytest httpx
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest tests/

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::REDACTED_ACCOUNT_ID:role/GitHubActionsRole
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push API image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_API:latest -f Dockerfile .
        docker push -a $ECR_REGISTRY/$ECR_REPOSITORY_API

    - name: Build, tag, and push Dashboard image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_DASHBOARD:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_DASHBOARD:latest -f Dockerfile.dashboard .
        docker push -a $ECR_REGISTRY/$ECR_REPOSITORY_DASHBOARD

    - name: Update KubeConfig
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Deploy to Amazon EKS
      run: |
        # Set images in k8s manifests
        sed -i "s|image: hotel-mlops-api.*|image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:latest|g" k8s/05-api.yaml
        sed -i "s|image: hotel-mlops-dashboard.*|image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_DASHBOARD }}:latest|g" k8s/06-dashboard.yaml
        kubectl apply -f k8s/