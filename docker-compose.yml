services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_USER: mlops_user
      POSTGRES_PASSWORD: mlops_password
      POSTGRES_DB: mlflow_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops_user -d mlflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # AWS emulator (S3 only) - lets MLflow and DVC exercise real S3 API calls
  # locally without touching a real AWS account. Pinned to 4.14.0: LocalStack
  # versions from 2026.03.0 onward require a free account + auth token
  # (LOCALSTACK_AUTH_TOKEN) even for community services, which would add
  # a signup step to what should be a zero-setup local stack. Upgrade path:
  # sign up for the free Hobby tier, set LOCALSTACK_AUTH_TOKEN, then bump
  # this to `latest`.
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      - SERVICES=s3
      - DEBUG=0
      - PERSISTENCE=0
    ports:
      - "4566:4566"
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    # Official image, not a custom Dockerfile: simpler to reason about, at
    # the cost of installing the Postgres/S3 drivers (not bundled upstream)
    # every time the container starts instead of baking them into an image
    # once. Kept in lockstep with the mlflow client pinned in api/ and
    # core_ml/'s poetry.lock - a 2.x server with a 3.x client is not a
    # supported combination.
    image: ghcr.io/mlflow/mlflow:v3.15.2
    # --allowed-hosts: MLflow >=3 rejects any request whose Host header it does
    # not recognise ("possible DNS rebinding attack"), and the default list is
    # localhost + private IPs only. The api and dashboard containers reach this
    # server as `mlflow`, a Docker service name, so it has to be listed here or
    # every client call comes back 403. The Host header a browser sends is
    # derived from the URL it was given - i.e. the *host*-published port
    # (5050 below), not the container-internal port MLflow listens on (5000,
    # unaffected by the host port mapping and still what api/dashboard use
    # to reach `mlflow:5000` over the internal Docker network) - so both
    # must be listed.
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary boto3 &&
      mlflow server
      --backend-store-uri postgresql://mlops_user:mlops_password@db:5432/mlflow_db
      --default-artifact-root s3://mlflow-artifacts/
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5050,127.0.0.1,127.0.0.1:5050
      --host 0.0.0.0 --port 5000"
    environment:
      # Dummy credentials LocalStack accepts unconditionally; points MLflow's
      # S3 artifact store at LocalStack instead of real AWS.
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - MLFLOW_S3_ENDPOINT_URL=http://localstack:4566
    ports:
      # Host-side 5050, not MLflow's default 5000: 5000 is a very common
      # default (Flask, kubectl port-forward, other MLflow stacks) to
      # already be bound on a dev machine running more than one project.
      # api/dashboard reach this service over the internal Docker network as
      # `mlflow:5000` regardless of the host mapping, so this only affects
      # host-machine browser/CLI access to the MLflow UI.
      - "5050:5000"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      # Same LocalStack S3 credentials/endpoint as the mlflow service above:
      # mlflow.sklearn.load_model() pulls the model artifact straight from
      # the s3:// artifact store via boto3, so the API needs S3 access too,
      # not just the mlflow server itself. In production this is the EKS
      # node group's own IAM role (see terraform/eks.tf) instead of static keys.
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - MLFLOW_S3_ENDPOINT_URL=http://localstack:4566
      # Inference logging (api/monitoring.py). Same env contract the production
      # ConfigMap/Secret provide, pointed at the local Postgres, so the
      # prediction log and the ground-truth labels behave here exactly as they
      # do in the cluster - including the schema being created on first start.
      - MODEL_REFRESH_SECONDS=300
      - MONITORING_ENABLED=true
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_USER=mlops_user
      - POSTGRES_PASSWORD=mlops_password
      - POSTGRES_DB=mlflow_db
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
      localstack:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

  # The drift check, as a one-shot container - the same image and the same
  # entrypoint the production CronJob runs (Dockerfile.jobs), so the loop can
  # be exercised end to end on a laptop before it is ever scheduled in EKS.
  # Behind a profile because it is a job, not a service: `make up` must not
  # start it. Run it with `make drift-check` after `make replay` has produced
  # traffic.
  drift-check:
    build:
      context: .
      dockerfile: Dockerfile.jobs
    profiles: ["jobs"]
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_USER=mlops_user
      - POSTGRES_PASSWORD=mlops_password
      - POSTGRES_DB=mlflow_db
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - MLFLOW_S3_ENDPOINT_URL=http://localstack:4566
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
