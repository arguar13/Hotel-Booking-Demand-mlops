# Shift-left validation gate for this repo.
#
# ruff/mypy/pytest run through `poetry -C <dir>` instead of the usual
# pre-commit "mirror" repos, so there is a single source of truth for tool
# versions (each sub-project's poetry.lock) shared by local dev, these
# hooks, and CI (`make lint` / `make test`).
#
# In a real production setup you would likely add a secret scanner
# (detect-secrets), a security linter (bandit), an image/IaC scanner
# (trivy) and a YAML style linter (yamllint) - exactly the kind of gate
# worth having once more than one person touches the repo.
#
# Setup: `make install` (installs both poetry envs + registers these hooks).
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: local
    hooks:
      # --- terraform/ ---
      - id: terraform-fmt
        name: terraform fmt (terraform/)
        entry: terraform -chdir=terraform fmt -check -diff -recursive
        language: system
        files: ^terraform/.*\.tf$
        pass_filenames: false

      # --- api/ (FastAPI serving microservice) ---
      - id: ruff-api
        name: ruff check (api)
        entry: poetry -C api run ruff check --fix
        language: system
        files: ^api/.*\.py$
        pass_filenames: false
        args: ["."]

      - id: ruff-format-api
        name: ruff format (api)
        entry: poetry -C api run ruff format
        language: system
        files: ^api/.*\.py$
        pass_filenames: false
        args: ["."]

      - id: mypy-api
        name: mypy (api) - advisory, never blocks a commit
        entry: bash -c 'poetry -C api run mypy . || true'
        language: system
        files: ^api/.*\.py$
        pass_filenames: false
        verbose: true

      - id: pytest-api
        name: pytest (api)
        entry: poetry -C api run pytest
        language: system
        files: ^api/.*\.py$
        pass_filenames: false
        args: []

      # --- core_ml/ (training pipeline, data processing, dashboard) ---
      - id: ruff-core-ml
        name: ruff check (core_ml)
        entry: poetry -C core_ml run ruff check --fix
        language: system
        files: ^core_ml/.*\.py$
        pass_filenames: false
        args: ["."]

      - id: ruff-format-core-ml
        name: ruff format (core_ml)
        entry: poetry -C core_ml run ruff format
        language: system
        files: ^core_ml/.*\.py$
        pass_filenames: false
        args: ["."]

      - id: mypy-core-ml
        name: mypy (core_ml) - advisory, never blocks a commit
        entry: bash -c 'poetry -C core_ml run mypy . || true'
        language: system
        files: ^core_ml/.*\.py$
        pass_filenames: false
        verbose: true

      - id: pytest-core-ml
        name: pytest (core_ml)
        entry: poetry -C core_ml run pytest
        language: system
        files: ^core_ml/.*\.py$
        pass_filenames: false
        args: []
