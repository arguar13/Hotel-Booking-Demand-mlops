apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every namespaced resource below carries an explicit metadata.namespace:
# hotel-mlops, so nothing accidentally lands in the shared `default`
# namespace, which has no RBAC boundary of its own.
#
# `mlops-secrets` (POSTGRES_PASSWORD) is NOT declared here: it is a plain
# Kubernetes Secret created once by hand with `kubectl create secret` (see
# the README's "Desplegar" section) rather than committed to Git or
# generated by Terraform/kustomize - a real secret value has no business in
# a file that gets committed.

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - mlflow.yaml
  - api.yaml
  - dashboard.yaml
  - drift-monitor-cronjob.yaml

# Generated rather than declared as a plain resource, so its name carries a
# hash of its contents. Kustomize rewrites the envFrom references in the
# Deployments to the hashed name, which means editing a value here changes the
# Deployment spec and therefore triggers a rollout. With a static ConfigMap,
# `envFrom` values are only read at pod start, so a changed value silently
# never reaches the running pods.
configMapGenerator:
  - name: mlops-config
    namespace: hotel-mlops
    envs:
      - mlops-config.env

labels:
  - pairs:
      app.kubernetes.io/part-of: hotel-mlops
    includeSelectors: true
