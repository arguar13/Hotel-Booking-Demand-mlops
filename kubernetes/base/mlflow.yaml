apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlflow-sa
      # UID 1000 is the `mlflowuser` baked into the image (see Dockerfile.mlflow).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          # Built from Dockerfile.mlflow (boto3/psycopg2 baked in at build
          # time) - no more installing dependencies over the network on
          # every pod start. Tag is set per-overlay via `kustomize edit
          # set image`.
          image: hotel-mlops-mlflow:local
          command: ["mlflow", "server"]
          args:
            - "--backend-store-uri=postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)"
            - "--default-artifact-root=s3://$(S3_BUCKET_NAME)/mlflow"
            # See MLFLOW_ALLOWED_HOSTS in kubernetes/base/configmap.yaml.
            - "--allowed-hosts=$(MLFLOW_ALLOWED_HOSTS)"
            - "--host=0.0.0.0"
            - "--port=5000"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: mlops-secrets
            - configMapRef:
                name: mlops-config
          # Read-only root filesystem: MLflow stages artifacts through a temp
          # dir before pushing them to S3, and keeps its client cache in $HOME.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/mlflowuser
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
  type: LoadBalancer
