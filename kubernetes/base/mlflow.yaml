apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlflow-sa
      containers:
        - name: mlflow
          # Built from Dockerfile.mlflow (boto3/psycopg2 baked in at build
          # time) - no more installing dependencies over the network on
          # every pod start. Tag is set per-overlay via `kustomize edit
          # set image`.
          image: hotel-mlops-mlflow:local
          command: ["mlflow", "server"]
          args:
            - "--backend-store-uri=postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)"
            - "--default-artifact-root=s3://$(S3_BUCKET_NAME)/mlflow"
            - "--host=0.0.0.0"
            - "--port=5000"
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: mlops-secrets
            - configMapRef:
                name: mlops-config
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
  type: LoadBalancer
