# Declarative replacement for the old flow (a committed Secret manifest
# with a "__DB_PASSWORD_PLACEHOLDER__" string that .gitlab-ci.yml's
# deploy-eks job would `sed -i` at deploy time). This CRD is 100% safe to
# commit - it only references *where* the secret lives in AWS Secrets
# Manager, never the value itself. ESO polls that reference on
# `refreshInterval` and materializes/updates the real `mlops-secrets`
# Kubernetes Secret from it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mlops-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mlops-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: hotel-mlops/db-password
        property: db_password
