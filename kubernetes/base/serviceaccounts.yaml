# Plain ServiceAccounts, with no IRSA annotation: the node group's own IAM
# role already carries the S3 permissions every pod needs (terraform/eks.tf's
# iam_role_additional_policies), so there is no per-service AWS role to
# attach here. Kept as three separate ServiceAccounts anyway, one per
# workload, so Kubernetes-level RBAC (if this project ever adds any) can
# still tell "the API" apart from "a batch job" without relying on IAM.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-sa
  namespace: hotel-mlops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: hotel-mlops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jobs-sa
  namespace: hotel-mlops
