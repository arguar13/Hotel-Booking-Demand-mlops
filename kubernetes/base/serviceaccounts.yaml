apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-sa
  annotations:
    # Replaced per-environment by overlays/<env>/patch-service-account-arns.yaml
    # (the real value comes from `terraform output mlflow_iam_role_arn`).
    eks.amazonaws.com/role-arn: "REPLACED_BY_OVERLAY"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  annotations:
    eks.amazonaws.com/role-arn: "REPLACED_BY_OVERLAY"
---
# Batch workloads (the drift monitor today, a scheduled retrain tomorrow) get
# their own identity rather than borrowing api-sa's. They are a different
# workload with a different blast radius and a different lifecycle: reusing the
# serving identity would mean every future permission a batch job needs is
# silently granted to the internet-facing API as well.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jobs-sa
  annotations:
    eks.amazonaws.com/role-arn: "REPLACED_BY_OVERLAY"
