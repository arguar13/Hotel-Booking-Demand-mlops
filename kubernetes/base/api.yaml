apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api-sa
      # UID 1000 is the `appuser` baked into the image (see Dockerfile).
      # runAsNonRoot makes the kubelet refuse to start the pod at all if a
      # future image regresses to running as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Tag set per-overlay via `kustomize edit set image` (CI writes
          # the freshly-built $IMAGE_TAG here, then commits - see
          # .gitlab-ci.yml's gitops-release job).
          image: hotel-mlops-api:local
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: mlops-secrets
            - configMapRef:
                name: mlops-config
          # The root filesystem is read-only, so give the two paths that
          # genuinely need to be written an ephemeral volume each: MLflow
          # downloads the model artifact from S3 into a temp dir on startup,
          # and its client keeps a small cache under $HOME.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/appuser
          # Readiness and liveness answer different questions, so they point at
          # different endpoints. /ready is 503 until a model is actually loaded,
          # which keeps a replica out of the Service until it can serve real
          # predictions - during a rollout, mlflow and api restart together, so
          # the api is briefly up with no model. /health only reports that the
          # process is alive: a missing model must not restart the container,
          # because the background loader is already retrying and a restart
          # would just reset that progress.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
  type: LoadBalancer
