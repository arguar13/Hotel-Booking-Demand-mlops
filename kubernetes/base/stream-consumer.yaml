# Near-real-time drift early-warning (core_ml/src/monitoring/stream_consumer.py),
# alongside the drift-monitor CronJob, not instead of it - see that module's
# docstring for why a long-running Kafka consumer and a daily batch job answer
# different questions on different timescales.
#
# A Deployment, not a CronJob: unlike drift-monitor, this workload has no
# natural "run once, exit" boundary - it holds a Kafka consumer group
# membership and reacts to a stream, which is what a long-running process is
# for. One replica: MSK's default partition count for a topic this size is
# small, and a second replica in the same consumer group would only rebalance
# partitions between them for no throughput this workload needs - it is the
# heartbeat-driven livenessProbe below, not extra replicas, that recovers a
# wedged consumer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-consumer
  namespace: hotel-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-consumer
  template:
    metadata:
      labels:
        app: stream-consumer
    spec:
      serviceAccountName: jobs-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stream-consumer
          # Same image as the drift-monitor CronJob (Dockerfile.jobs) - this
          # is core_ml's code with a different `command:`, not a separate
          # build. Tag set per-overlay via `kustomize edit set image`.
          image: hotel-mlops-jobs:local
          imagePullPolicy: Always
          command: ["python", "-m", "src.monitoring.stream_consumer"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            # The same ConfigMap/Secret the api Deployment and the
            # drift-monitor CronJob consume - one definition of "where
            # MLflow, Postgres and Kafka are" in Git, not three.
            - secretRef:
                name: mlops-secrets
            - configMapRef:
                name: mlops-config
          # A steady-state consumer, not a bursty batch job: this holds one
          # 15-minute window's worth of predictions and a bootstrap resample
          # in memory at a time, an order of magnitude less than
          # drift-monitor's 24-hour window.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          # stream_consumer.py writes a timestamp to this path every time it
          # polls Kafka or evaluates a window (HEARTBEAT_PATH). A consumer
          # that is wedged - not crashed, so Kubernetes has no exit code to
          # notice - stops updating it, and the probe below catches that the
          # same way 612's CloudWatch heartbeat alarm catches a batch job
          # that stops running: silence itself is the signal.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  test $(( $(date +%s) - $(date -r /tmp/stream_consumer_heartbeat +%s 2>/dev/null || echo 0) )) -lt 600
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/appuser
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
