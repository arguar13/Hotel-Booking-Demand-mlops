# Tells External Secrets Operator how to reach AWS Secrets Manager. Auth is
# IRSA (external-secrets-sa is annotated with an IAM role scoped to
# secretsmanager:GetSecretValue on hotel-mlops/* only - see
# terraform/iam.tf's external_secrets_irsa_role) - no AWS keys live
# anywhere in the cluster or in Git.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
