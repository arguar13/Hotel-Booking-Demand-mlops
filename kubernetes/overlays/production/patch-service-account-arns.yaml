# Real values come from `terraform output mlflow_iam_role_arn` /
# `terraform output api_iam_role_arn`. These change only when the
# underlying IAM roles are recreated (rare - a Terraform-driven event, not
# a per-deploy one), so unlike image tags they're refreshed by hand (or by
# `make k8s-sync-terraform-outputs`, see Makefile) rather than on every CI
# run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-sa
  namespace: hotel-mlops
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::REDACTED_ACCOUNT_ID:role/hotel-mlops-mlflow-irsa"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: hotel-mlops
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::REDACTED_ACCOUNT_ID:role/hotel-mlops-api-irsa"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jobs-sa
  namespace: hotel-mlops
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::REDACTED_ACCOUNT_ID:role/hotel-mlops-jobs-irsa"
