data:
  raw_data_path: "data/hotel_bookings.csv"
  processed_data_path: "data/processed_hotel_bookings.csv"
  # ~1000-row, DVC-tracked, deterministic sample of the raw dataset used for
  # fast end-to-end local runs (see scripts/make_toy_dataset.py). Enable with
  # HOTEL_MLOPS_USE_TOY_DATA=true (or `make train-toy` / `make data-toy`).
  toy_raw_data_path: "data/toy/hotel_bookings_toy.csv"
  toy_processed_data_path: "data/toy/processed_hotel_bookings_toy.csv"
  toy_sample_size: 1000
  valid_classes_min_count: 10
  # Optional upper bound on the arrival year used for training - a training
  # period, which every production model has whether or not it is written
  # down. Left empty the whole dataset is used.
  #
  # It is also what makes an honest drift backtest possible: this dataset
  # spans 2015-07 to 2017-08 and its booking mix genuinely shifts towards
  # online travel agencies over that period, so training with
  # train_max_year: 2016 and then replaying 2017 through the API
  # (scripts/replay_bookings.py) measures the monitor against drift that
  # actually happened, rather than against injected noise.
  train_max_year: null

model:
  target_column: "market_segment"
  # Three-way split, not two-way: Optuna tunes against validation_size only.
  # test_size is set aside before tuning starts and is touched exactly once,
  # for the final quality-gate score and the monitoring baseline - so that
  # figure is an honest estimate of production performance rather than a
  # hyperparameter-selection score wearing a "held-out" label.
  test_size: 0.2
  validation_size: 0.2
  random_state: 42
  n_trials_optuna: 2
  # Quality gate: a trained model version is only ever a promotion
  # *candidate* when its weighted F1 on the held-out test split meets this
  # bar. A run that misses it is still logged to MLflow for audit, but the
  # run fails loudly (non-zero exit) and is never considered by
  # promote_model.py. Absolute, not relative - it is the floor a model must
  # clear regardless of how the currently-served version is doing.
  min_f1_threshold: 0.60

  # Promotion (core_ml/src/promote_model.py), the step *after* train.py:
  # train.py registers a version and applies min_f1_threshold above, but no
  # longer moves the registry alias itself - that decision now requires
  # beating the model already serving, not just clearing an absolute floor.
  # Passing min_f1_threshold and still being worse than production is
  # exactly the gap an absolute-only gate cannot see, and exactly what let
  # a retrain triggered by drift promote a regression with nobody having
  # compared the two.
  #
  # canary_tolerance allows the challenger to score up to this much *below*
  # the champion's weighted F1 and still promote - a small negative number,
  # not zero, because requiring a strict improvement on every retrain would
  # reject a model that recovered most but not all of a real regression,
  # which is still worth shipping. Both figures are read from each model
  # version's own logged reference profile (build_reference_profile's
  # performance.f1_weighted), not from a live re-scoring pass - see
  # promote_model.py's module docstring for why that trade-off was made
  # consciously rather than overlooked.
  canary_tolerance: -0.01
  registry_name: "HotelSegmentClassifier"
  # MLflow Model Registry alias (not the deprecated stages API) the serving
  # API reads from via `models:/<registry_name>@<registry_alias>`.
  registry_alias: "staging"

mlflow:
  experiment_name: "hotel_market_segmentation"
  tracking_uri: "http://localhost:5000"

# Drift monitoring. Read by the CronJob in kubernetes/base/drift-monitor-cronjob.yaml
# (src/monitoring/drift_monitor.py), never by the API. Every threshold here is a
# deliberate operating point, not a default someone forgot to tune - a monitor
# that fires on noise gets silenced within a fortnight, and a silenced monitor
# is worse than none because it is still believed.
monitoring:
  experiment_name: "hotel_market_segmentation_monitoring"

  # The half-open window each run evaluates. Daily is the right cadence for a
  # reconciliation delay measured in hours-to-days: shorter windows carry too
  # few labels to say anything, longer ones average a change away.
  window_hours: 24

  # Sample-size guards. Below these, the run reports SKIPPED rather than "no
  # drift" - the distinction matters, because "we could not tell" and "we
  # checked and it is fine" call for very different responses.
  min_predictions: 500
  min_labelled: 300
  # Hard cap on rows pulled into memory; the CronJob has a memory limit and a
  # monitor that gets OOM-killed goes quiet exactly when traffic spikes.
  max_rows: 200000

  # Data drift escalates on the *share* of features that moved, not on any
  # single one: one drifted feature out of thirty is ordinary seasonality,
  # a third of them moving together is a pipeline change or a new population.
  # Per-feature PSI still uses the standard 0.10 / 0.25 bands (statistics.py).
  drift_share_warn: 0.20
  drift_share_alert: 0.35

  # Confidence drift is a proxy, so it can only ever raise WARN. A 10% relative
  # fall in mean top-class probability is large enough not to trip on a
  # genuinely harder week.
  confidence_relative_tolerance: 0.10

  # Concept drift - the one that matters. Weighted F1 on the labelled window,
  # against the baseline logged with the served model version. The alert
  # tolerance is set where the drop is worth acting on, not where it becomes
  # detectable; the bootstrap interval then has to agree before it escalates.
  f1_warn_tolerance: 0.03
  f1_alert_tolerance: 0.05
  bootstrap_resamples: 1000

  # Hysteresis: a single alerting window is recorded but does not escalate.
  # Two consecutive windows on the same model version must agree first, which
  # is what separates a real regression from one unlucky Tuesday.
  consecutive_alerts_required: 2

  # A confirmed ALERT exits non-zero, so the Job shows as Failed and whatever
  # already watches Kubernetes job failures sees it - the same "fail loudly"
  # posture as the training quality gate, rather than a new alerting channel
  # this project would have to own.
  fail_on_alert: true

  # Near-real-time early warning (core_ml/src/monitoring/stream_consumer.py),
  # not a second monitor: the consumer overlays these fields onto the block
  # above and calls the exact same run_monitor() the CronJob does, only over
  # a much shorter, Kafka-triggered window. Everything not listed here
  # (drift_share_*, confidence_relative_tolerance, f1_*, bootstrap_resamples,
  # min_labelled, max_rows) is inherited unchanged.
  stream:
    # Separate MLflow experiment so this monitor's hysteresis counter
    # (count_consecutive_alerts) never mixes with the daily CronJob's - a
    # burst of short, noisy windows must not silently satisfy (or reset) the
    # streak the batch monitor is counting, and vice versa.
    experiment_name: "hotel_market_segmentation_monitoring_stream"
    window_hours: 0.25 # 15 minutes
    # Far below the batch job's 500: a 15-minute window at this project's
    # traffic simply will not see 500 predictions, and requiring it would
    # make this monitor permanently SKIPPED, which is worse than never
    # having built it.
    min_predictions: 50
    # Noisier, smaller windows need more agreement before they are allowed to
    # trigger mitigation.py's auto-retrain - 3 consecutive short windows
    # roughly matches the statistical weight of the batch monitor's 2 daily
    # ones, at a fraction of the sample size each.
    consecutive_alerts_required: 3
    # min_labelled is intentionally NOT overridden here: at 15-minute
    # windows, reconciled ground truth almost never exists yet, so
    # concept_drift correctly reports SKIPPED (see drift_monitor.py's
    # compute_concept_drift) rather than a manufactured verdict. This
    # consumer's real contribution is data/prediction/confidence drift,
    # hours before the batch job would see the same window at all.
    kafka_topic: "predictions"
    kafka_consumer_group: "hotel-mlops-stream-monitor"
    # Micro-batch trigger, not per-message evaluation: recomputing drift
    # statistics on every single prediction event would be both wasteful and
    # noisier than the sample size supports. Whichever of these fires first
    # triggers one run_monitor() pass.
    trigger_batch_size: 25
    trigger_max_interval_seconds: 300

# Automatic mitigation (core_ml/src/monitoring/mitigation.py). Consumed by
# both the batch CronJob and stream_consumer.py, deliberately never by
# train.py itself - training stays retrain-on-command either way, this only
# decides *when* an ALERT verdict is allowed to issue that command
# automatically, and gates *promotion* behind a canary comparison rather
# than trusting a fresh training run on its own (see
# core_ml/src/promote_model.py).
mitigation:
  enabled: true

  # Bounded auto-retrain, mechanism 1: no new automatic pipeline trigger
  # within this many hours of the last one, regardless of which monitor
  # (batch or stream) is asking. Without this, a batch ALERT and a stream
  # ALERT minutes apart - both correctly hysteresis-gated on their own
  # terms - would still fire two full retrains for the same underlying
  # incident.
  cooldown_hours: 6

  # Bounded auto-retrain, mechanism 2: a hard ceiling on how many automatic
  # retrains this system will launch itself in a rolling window. A drift
  # source that a retrain cannot fix (an upstream data-quality break, not a
  # genuine distribution shift) would otherwise retrigger every
  # cooldown_hours forever. Hitting the ceiling fails loudly instead -
  # logged at ERROR and left for a human, the same "evidence, not a
  # decision" posture drift_monitor.py already has for detection.
  max_auto_retrains: 3
  max_auto_retrains_window_days: 7

  # GitLab Pipeline Trigger API (terraform/secrets.tf provisions the
  # token). A bounded HTTP call, not a queued/retried job: a trigger that
  # cannot reach GitLab within this timeout fails the mitigation attempt
  # and is logged, rather than blocking the monitor process or retrying
  # without limit.
  gitlab_api_url_env: "GITLAB_API_URL"
  gitlab_project_path_env: "GITLAB_PROJECT_PATH"
  gitlab_ref_env: "GITLAB_REF"
  gitlab_token_env: "GITLAB_TRIGGER_TOKEN"
  trigger_timeout_seconds: 10
