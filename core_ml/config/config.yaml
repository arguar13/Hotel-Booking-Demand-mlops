data:
  raw_data_path: "data/hotel_bookings.csv"
  processed_data_path: "data/processed_hotel_bookings.csv"
  # ~1000-row, DVC-tracked, deterministic sample of the raw dataset used for
  # fast end-to-end local runs (see scripts/make_toy_dataset.py). Enable with
  # HOTEL_MLOPS_USE_TOY_DATA=true (or `make train-toy` / `make data-toy`).
  toy_raw_data_path: "data/toy/hotel_bookings_toy.csv"
  toy_processed_data_path: "data/toy/processed_hotel_bookings_toy.csv"
  toy_sample_size: 1000
  valid_classes_min_count: 10
  # Optional upper bound on the arrival year used for training - a training
  # period, which every production model has whether or not it is written
  # down. Left empty the whole dataset is used.
  #
  # It is also what makes an honest drift backtest possible: this dataset
  # spans 2015-07 to 2017-08 and its booking mix genuinely shifts towards
  # online travel agencies over that period, so training with
  # train_max_year: 2016 and then replaying 2017 through the API
  # (scripts/replay_bookings.py) measures the monitor against drift that
  # actually happened, rather than against injected noise.
  train_max_year: null

model:
  target_column: "market_segment"
  # Three-way split, not two-way: Optuna tunes against validation_size only.
  # test_size is set aside before tuning starts and is touched exactly once,
  # for the final quality-gate score and the monitoring baseline - so that
  # figure is an honest estimate of production performance rather than a
  # hyperparameter-selection score wearing a "held-out" label.
  test_size: 0.2
  validation_size: 0.2
  random_state: 42
  n_trials_optuna: 2
  # Quality gate: a trained model version is only ever a promotion
  # *candidate* when its weighted F1 on the held-out test split meets this
  # bar. A run that misses it is still logged to MLflow for audit, but the
  # run fails loudly (non-zero exit) and is never considered by
  # promote_model.py. Absolute, not relative - it is the floor a model must
  # clear regardless of how the currently-served version is doing.
  min_f1_threshold: 0.60

  # Promotion (core_ml/src/promote_model.py), the step *after* train.py:
  # train.py registers a version and applies min_f1_threshold above, but no
  # longer moves the registry alias itself - that decision now requires
  # beating the model already serving, not just clearing an absolute floor.
  # Passing min_f1_threshold and still being worse than production is
  # exactly the gap an absolute-only gate cannot see, and exactly what let
  # a retrain triggered by drift promote a regression with nobody having
  # compared the two.
  #
  # canary_tolerance allows the challenger to score up to this much *below*
  # the champion's weighted F1 and still promote - a small negative number,
  # not zero, because requiring a strict improvement on every retrain would
  # reject a model that recovered most but not all of a real regression,
  # which is still worth shipping. Both figures are read from each model
  # version's own logged reference profile (build_reference_profile's
  # performance.f1_weighted), not from a live re-scoring pass - see
  # promote_model.py's module docstring for why that trade-off was made
  # consciously rather than overlooked.
  canary_tolerance: -0.01
  registry_name: "HotelSegmentClassifier"
  # MLflow Model Registry alias (not the deprecated stages API) the serving
  # API reads from via `models:/<registry_name>@<registry_alias>`.
  registry_alias: "staging"

mlflow:
  experiment_name: "hotel_market_segmentation"
  tracking_uri: "http://localhost:5000"

# Drift monitoring. Read by the CronJob in kubernetes/base/drift-monitor-cronjob.yaml
# (src/monitoring/drift_check.py), never by the API. See that module's
# docstring for how the check itself works (a per-feature z-test against the
# mean/std recorded at training time).
monitoring:
  experiment_name: "hotel_market_segmentation_monitoring"

  # The trailing window each run evaluates. Daily is a reasonable cadence for
  # a small service: enough traffic accumulates to say something, without
  # running the check so often that every run competes for the same
  # database connections as the API.
  window_hours: 24

  # Below this many predictions in the window, the run reports SKIPPED rather
  # than "no drift" - the distinction matters, because "we could not tell"
  # and "we checked and it is fine" call for very different responses.
  min_predictions: 500
  # Hard cap on rows pulled into memory, so a traffic spike cannot make this
  # job OOM instead of just taking a bit longer.
  max_rows: 200000

  # Significance level for the per-feature z-test: a feature's batch mean is
  # flagged when its two-sided p-value drops below this. 0.05 is the common
  # default; lower it (e.g. 0.01) if the check fires too often on noise.
  alpha: 0.05

  # A confirmed ALERT exits non-zero, so the Job shows as Failed and whatever
  # already watches Kubernetes job failures sees it - the same "fail loudly"
  # posture as the training quality gate, rather than a new alerting channel
  # this project would have to own. The check only ever reports; nothing
  # retrains or promotes automatically - see core_ml/src/promote_model.py for
  # that decision.
  fail_on_alert: true
