[tool.poetry]
name = "hotel-mlops-core"
version = "1.0.0"
description = "Data Pipeline, Entrenamiento y Monitoreo MLOps"
authors = ["Tu Nombre <tu@email.com>"]
packages = [
    {include = "src"},
    {include = "dashboard"}
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13" #[cite: 27]
# Data Science & Machine Learning
pandas = ">=2.1.1" #[cite: 27]
numpy = "<2.0.0" # mlflow==2.11.3 pins numpy<2; keep aligned with api/pyproject.toml
scikit-learn = ">=1.4.0" #[cite: 27]
imbalanced-learn = "^0.14.0" # <0.14 is incompatible with the resolved scikit-learn>=1.6/1.7
optuna = "^3.5.0" #[cite: 27]
pandera = "^0.20.4"
structlog = "^26.1.0" # JSON logs (CloudWatch/ELK-friendly), same approach as api/

# MLOps & Infraestructura
mlflow = "==2.11.3" #[cite: 27]
setuptools = "^75.0" # mlflow imports pkg_resources at runtime; not preinstalled in a bare venv
dvc = {extras = ["s3"], version = "^3.48.0"} # ¡Restaurado! Sin conflictos de resolución[cite: 27]
boto3 = "==1.34.62" #[cite: 27]
psycopg2-binary = "==2.9.9" #[cite: 27]

# UI & Monitoreo
streamlit = "==1.32.0" #[cite: 27]
requests = "==2.31.0" #[cite: 27]
pydantic = "^2.0.0" # Permitimos la versión moderna para estas herramientas[cite: 27]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^6.0.0"
black = "^24.10.0"
ruff = "^0.13.0"
isort = "^5.13.2"
mypy = "^1.13.0"
bandit = {extras = ["toml"], version = "^1.7.10"}
pre-commit = "^4.0.1"
types-pyyaml = "^6.0.12"
types-requests = "^2.32.0"
yamllint = "^1.38.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "dashboard"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
