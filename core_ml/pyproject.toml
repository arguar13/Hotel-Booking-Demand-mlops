[tool.poetry]
name = "hotel-mlops-core"
version = "1.0.0"
description = "Data Pipeline, Entrenamiento y Monitoreo MLOps"
authors = ["Tu Nombre <tu@email.com>"]
packages = [
    {include = "src"},
    {include = "dashboard"}
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13" #[cite: 27]
# Data Science & Machine Learning
pandas = ">=2.1.1" #[cite: 27]
numpy = "<2.0.0" # mlflow==2.11.3 pins numpy<2; keep aligned with api/pyproject.toml
scikit-learn = ">=1.4.0" #[cite: 27]
imbalanced-learn = "^0.14.0" # <0.14 is incompatible with the resolved scikit-learn>=1.6/1.7
optuna = "^3.5.0" #[cite: 27]
pandera = "^0.20.4"
scipy = "^1.13.0" # the z-test in src/monitoring/drift_check.py
structlog = "^26.1.0" # JSON logs (CloudWatch/ELK-friendly), same approach as api/

# MLOps & Infraestructura
# Version floors, not exact pins: poetry.lock is what makes a build
# reproducible, so pinning here too would only block security patches.
mlflow = "^3.15.0"     # 2.11.3 carried 35 HIGH/CRITICAL CVEs; also pulls fixed
                       # gunicorn/protobuf/pyarrow transitively
setuptools = "^78.1.1" # mlflow imports pkg_resources at runtime; >=78.1.1 fixes CVE-2025-47273
dvc = {extras = ["s3"], version = "^3.48.0"}
boto3 = "^1.34.62"
psycopg2-binary = "^2.9.9"

# UI & Monitoreo
streamlit = "^1.40.0"
requests = "^2.32.0"

# Transitive-only dependencies (pulled in by mlflow / streamlit / matplotlib),
# declared here purely to raise their floor above known HIGH/CRITICAL CVEs.
# Poetry has no separate constraints file, so an explicit entry is the
# supported way to bound a transitive package. Drop these once the upstream
# floors move past them.
gunicorn = "^22.0.0"  # CVE-2024-1135 / CVE-2024-6827 (request smuggling)
pillow = "^12.1.1"    # 13 CVEs in 10.4.0 (heap OOB write, several DoS paths)
pyarrow = "^23.0.1"   # CVE-2026-25087 (use-after-free DoS)
pydantic = "^2.0.0" # Permitimos la versión moderna para estas herramientas[cite: 27]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^6.0.0"
ruff = "^0.13.0"
mypy = "^1.13.0"
pre-commit = "^4.0.1"
types-pyyaml = "^6.0.12"
types-requests = "^2.32.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
# `ruff format` replaces black+isort: it formats code the same way black does
# and sorts imports the same way the "I" rule above does.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
