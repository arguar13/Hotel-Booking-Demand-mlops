# Repository credentials ArgoCD uses to clone this (private) GitOps repo.
#
# Safe to commit: it holds only a *reference* to AWS Secrets Manager, never the
# credential itself. External Secrets Operator (bootstrapped by
# terraform/external-secrets.tf) reads hotel-mlops/argocd-repo through the
# external-secrets-sa IRSA role and materializes the real Kubernetes Secret -
# exactly the same pattern kubernetes/base/external-secret-db.yaml uses for the
# RDS password.
#
# Applied out-of-band (like gitops/argocd/application.yaml) rather than through
# ArgoCD itself, for the obvious reason: ArgoCD cannot sync the repository that
# contains its own credentials for reading that repository.
#
#   kubectl apply -f gitops/argocd/repo-credentials-externalsecret.yaml
#
# To rotate: replace the value in Secrets Manager. ESO picks it up on the next
# refreshInterval - no manifest change, no redeploy.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-repo-credentials
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: argocd-repo-credentials
    creationPolicy: Owner
    template:
      # ArgoCD discovers repository credentials by this label, and expects the
      # url/username/password keys below.
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://gitlab.com/personal-group7745334/hotel-booking-mlops-v2.git
        username: "{{ .username }}"
        # Not a credential: a Go template placeholder that External Secrets
        # Operator substitutes at runtime from the value it reads out of AWS
        # Secrets Manager.
        password: "{{ .password }}"  # pragma: allowlist secret
  data:
    - secretKey: username
      remoteRef:
        key: hotel-mlops/argocd-repo
        property: username
    - secretKey: password
      remoteRef:
        key: hotel-mlops/argocd-repo
        # Not a credential: the *name* of the JSON field to read out of the
        # Secrets Manager entry above.
        property: password  # pragma: allowlist secret
