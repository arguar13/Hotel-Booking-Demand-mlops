---
extends: default

ignore: |
  .venv/
  **/.venv/
  node_modules/
  # Downloaded terraform provider/module cache (third-party code, not ours
  # to lint) and MLflow's own generated per-run artifacts - both already
  # git-ignored, but yamllint doesn't read .gitignore on its own.
  terraform/.terraform/
  **/mlruns/
  **/__pycache__/
  **/.mypy_cache/
  **/.ruff_cache/
  **/.pytest_cache/

rules:
  # `kustomize edit set image` rewrites
  # kubernetes/overlays/production/kustomization.yaml on every release, and it
  # emits block sequences unindented under their key. yamllint's default
  # (indent-sequences: true) rejects that, so each CI release would have broken
  # the *next* pipeline's yaml-lint. A tool owns the formatting of that file,
  # so the linter accepts either style rather than fighting it.
  indentation:
    indent-sequences: whatever
  line-length:
    max: 140
    level: warning
  document-start: disable
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  truthy:
    allowed-values: ["true", "false", "on"]
  braces:
    max-spaces-inside: 1
