[tool.poetry]
name = "hotel-mlops-api"
version = "1.0.0"
description = "Microservicio de Serving e Inferencia para Market Segmentation"
authors = ["Tu Nombre <tu@email.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "==0.103.2"
uvicorn = "==0.23.2"
mlflow = "==2.11.3"
pandas = "==2.1.1"
numpy = "<2.0.0"
pydantic = "^1.10.13"
starlette = "==0.27.0"
httpx = "==0.24.1"
scikit-learn = ">=1.4.0"
imbalanced-learn = "^0.14.0" # <0.14 is incompatible with the resolved scikit-learn>=1.6/1.7
setuptools = "^75.0" # mlflow imports pkg_resources at runtime; not preinstalled in a bare venv
kafka-python = "^2.0.2" # optional prediction-event producer, only active if KAFKA_BOOTSTRAP_SERVERS is set
boto3 = "^1.34.62" # mlflow.sklearn.load_model needs this for its S3 artifact store client (s3:// model URIs) - IRSA in prod, LocalStack locally
structlog = "^26.1.0"    # JSON logs (CloudWatch/ELK-friendly)
tenacity = "^9.1.4"      # bounded retry with backoff for MLflow/Kafka connections
pybreaker = "^1.4.1"     # circuit breaker around the Kafka publish path

[tool.poetry.group.dev.dependencies]
ruff = "^0.13.0"
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.13.0"
pytest = "^8.3.3"
pytest-cov = "^6.0.0"
bandit = {extras = ["toml"], version = "^1.7.10"}
pre-commit = "^4.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["api"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
